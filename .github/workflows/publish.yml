name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write   # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@6be3bc531cad43d59a76021ac2fd338892b3a1fe # main
    with:
      install-for-publish: true
    secrets: inherit
